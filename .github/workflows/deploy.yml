# Copy to .github/workflows/deploy.yml — HUMAN-TRIGGERED ONLY.
# Actions → deploy → Run workflow → pick the version. Rollback = same
# button, previous version.
#
# Per-repo values: SERVICE as in build.yml; KIND=service for rfq-api and
# app-api, KIND=workerpool for rebalancer, oracle-keeper and evmi.
# WIF_PROVIDER and DEPLOYER_SA come from `terraform output` in clear-infra.
name: deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to deploy (vX.Y.Z)"
        required: true

env:
  SERVICE: evmi
  KIND: workerpool
  REGISTRY: europe-west1-docker.pkg.dev/clear-prod/clear
  REGION: europe-west1
  WIF_PROVIDER: projects/1080703084772/locations/global/workloadIdentityPools/github/providers/github-oidc
  DEPLOYER_SA: clear-deployer@clear-prod.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          # worker pools need the beta component; without this the first
          # `gcloud beta` call stalls on an install prompt in CI
          install_components: beta

      - name: Roll the chosen version out
        run: |
          IMAGE="${REGISTRY}/${SERVICE}:${{ inputs.version }}"
          if [ "$KIND" = "workerpool" ]; then
            gcloud beta run worker-pools update "clear-${SERVICE}" \
              --image="$IMAGE" --region="$REGION"
          else
            gcloud run services update "clear-${SERVICE}" \
              --image="$IMAGE" --region="$REGION"
          fi
          echo "Deployed ${IMAGE} by ${{ github.actor }}"
